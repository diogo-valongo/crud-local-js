<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Compass</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        .search-box {
            margin-bottom: 20px;
            text-align: center;
            margin-right: 20px;
        }
        input[type="text"], input[type="date"], input[type="tel"], input[type="email"] {
            width: 97%;
            padding: 8px;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .btn {
            padding: 6px 12px;
            margin: 2px;
            border: none;
            cursor: pointer;
        }
        .btn-delete {
            background-color: #f44336;
            color: white;
        }
        .btn-add {
            background-color: #008CBA;
            color: white;
            margin-bottom: 20px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
    
</head>
<body>
    <h1>Cadastros</h1>

    <div class="search-box">
        <label for="search">Pesquisar Nome:</label>
        <input type="text" id="search" placeholder="Digite um nome...">
    </div>

    <table id="Cadastros">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Data de Nascimento</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>João Silva</td>
                <td>10/05/1990</td>
                <td>(11) 98765-4321</td>
                <td>joao.silva@email.com</td>
                <td>
                    <button class="btn btn-delete">Excluir</button>
                </td>
            </tr>
            <tr>
                <td>Maria Santos</td>
                <td>22/08/1985</td>
                <td>(21) 99999-1234</td>
                <td>maria.santos@email.com</td>
                <td>
                    <button class="btn btn-delete">Excluir</button>
                </td>
            </tr>
        </tbody>
    </table>

    
    <div style="text-align: right; margin-top: 20px; margin-right: 40px;">
        <button class="btn btn-add" onclick="document.getElementById('modal').style.display='block'">Adicionar Cadastro</button>
    </div>


    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <h2>Adicionar Cadastro</h2>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite o nome">
            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" placeholder="Digite o telefone">
            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite o e-mail">
            <button onclick="adicionaCadastro()" class="btn btn-add" style="margin-top: 20px;">Salvar</button>
        </div>
    </div>
    <script src="../js/arquivo.js"></script>
</body>
</html>
